info:
  name: Create Bank To Bank Transfer
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/services/EGF/rest/bank-to-bank-transfer/create?auth_token={{auth_token}}&tenantId={{tenantId}}"
  headers:
    - name: ""
      value: Content-Type
      description: application/json
  params:
    - name: auth_token
      value: "{{auth_token}}"
      type: query
    - name: tenantId
      value: "{{tenantId}}"
      type: query
  body:
    type: json
    data: |-
      {
        "RequestInfo": {
          "apiId": "Finance Data Migration",
          "action": "CREATE",
          "authToken": "{{auth_token}}"
        },
        "tenantId": "{{tenantId}}",
        "request": {
          "voucherDate": "15/10/2026",
          "fromFund": "Municipal Fund",
          "fromSchemeName": null,
          "fromDepartmentName": "Building Inspection Branch",
          "functionName": "Water Supply",
          "fromBankName": "State Bank of India",
          "fromBankAccountNumber": "555555555555",
          "toFund": "TEST FUND",
          "toDepartmentName": "Administration",
          "fromInterFundCode": "4702000001",
          "toInterFundCode": "4702000001",
          "toBankName": "State Bank of India",
          "toBankAccountNumber": "222222222222",
          "modeOfCollection": "RTGS/NEFT",
          "referenceNumber": "NEFT202610150001",
          "referenceDate": "15/10/2026",
          "amount": 0.50,
          "description": "Transfer of funds between bank accounts"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |
  # Bank-to-Bank Transfer API – Response Examples

  ## 1. Success Response

  **Status:** `SUCCESSFUL`

  ```json
  {
    "responseInfo": {
      "apiId": "Finance Data Migration",
      "ver": null,
      "ts": null,
      "resMsgId": null,
      "msgId": null,
      "status": "SUCCESSFUL"
    },
    "success": true,
    "message": "Bank-to-bank transfer created successfully",
    "timestamp": 1793079800537,
    "data": {
      "voucherId": 72,
      "voucherNumber": "1/CSL/00000035/10/2026-27",
      "message": "Bank-to-bank transfer created successfully"
    }
  }
  ```

  **Description:** The bank-to-bank transfer was created successfully, and the response contains the generated voucher ID and voucher number.

  ## 2. Error Response

  **HTTP Status:** `400 Bad Request`

  **Error Code:** `VALIDATION_ERROR`

  ```json
  {
    "ResponseInfo": {
      "apiId": null,
      "ver": null,
      "ts": "Tue Oct 27 11:15:19 IST 2026",
      "resMsgId": null,
      "msgId": null,
      "status": "400"
    },
    "Errors": [
      {
        "code": "VALIDATION_ERROR",
        "message": "Transfer From – bank is required",
        "description": "Transfer From – bank is required",
        "params": null
      }
    ]
  }
  ```

  **Description:** The request failed because the **Transfer From – Bank** field is mandatory but was not provided or was not populated correctly. Provide a valid source bank to proceed with the transfer.
