info:
  name: Get Work Order by Wok order Number
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/services/EGF/rest/workorder/?tenantId={{tenantId}}&auth_token={{auth_token}}&orderNumber=WO/001/26-27/00001226"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: tenantId
      value: "{{tenantId}}"
      type: query
    - name: auth_token
      value: "{{auth_token}}"
      type: query
    - name: orderNumber
      value: WO/001/26-27/00001226
      type: query
  body:
    type: json
    data: |-
      {
        "RequestInfo": {
          "apiId": "Finance Data Migration",
          "action": "VIEW",
          "authToken": "{{auth_token}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

