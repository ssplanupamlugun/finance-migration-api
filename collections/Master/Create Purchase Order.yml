info:
  name: Create Purchase Order
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/services/EGF/rest/purchaseorder/create?auth_token={{auth_token}}&tenantId={{tenantId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: auth_token
      value: "{{auth_token}}"
      type: query
    - name: tenantId
      value: "{{tenantId}}"
      type: query
  body:
    type: json
    data: |-
      {
        "RequestInfo": {
          "apiId": "Finance Data Migration",
          "action": "CREATE",
          "authToken": "{{auth_token}}"
        },
        "tenantId": "{{tenantId}}",
        "request": {
          "name": "Purchase Order for Office Supplies",
          "orderDate": "2026-08-29T00:00:00.000+05:30",
          "supplierName": "ANAND",
          "orderValue": 118000.00,
          "advancePayable": 20000.00,
          "description": "Purchase of office stationery and computer accessories",
          "fundName": "Municipal Fund",
          "departmentName": "Account Branch",
          "schemeName": null,
          "subSchemeName": null,
          "sanctionNumber": "SAN/2026/00125",
          "sanctionDate": "2026-08-25T00:00:00.000+05:30",
          "purchaseItems": [
            {
              "itemCode": "LAPTOP-DELL-001",
              "unit": "Nos",
              "unitRate": 50000.00,
              "quantity": 2,
              "gstRate": 18,
              "unitValueWithGst": 59000.00,
              "amount": 118000.00,
              "glcodeid": 4101001
            },
            {
              "itemCode": "PRINTER-HP-001",
              "unit": "Nos",
              "unitRate": 25000.00,
              "quantity": 1,
              "gstRate": 18,
              "unitValueWithGst": 29500.00,
              "amount": 29500.00,
              "glcodeid": 4101002
            }
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

