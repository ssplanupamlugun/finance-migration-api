info:
  name: Find By Id or Name for SubScheme
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/services/EGF/subscheme?tenantId={{tenantId}}&auth_token={{auth_token}}&name=Sub AMRUT"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: tenantId
      value: "{{tenantId}}"
      type: query
    - name: auth_token
      value: "{{auth_token}}"
      type: query
    - name: name
      value: Sub AMRUT
      type: query
  body:
    type: json
    data: |-
      {
        "RequestInfo": {
          "apiId": "Finance Data Migration",
          "action": "VIEW",
          "authToken": "{{auth_token}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

