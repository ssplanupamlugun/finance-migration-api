info:
  name: Create Wok
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/services/EGF/rest/work/create?auth_token={{auth_token}}&tenantId={{tenantId}}"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: auth_token
      value: "{{auth_token}}"
      type: query
    - name: tenantId
      value: "{{tenantId}}"
      type: query
  body:
    type: json
    data: |-
      {
        "RequestInfo": {
          "apiId": "Finance Data Migration",
          "action": "CREATE",
          "authToken": "{{auth_token}}"
        },
        "tenantId": "{{tenantId}}",
        "request": {
          "workName": "Road Repair - Sector 14 Main Road",
          "workType": "Repair & Maintenance",
          "fundName": "Municipal Fund",
          "startDate": "2026-01-07",
          "endDate": "2026-01-31",
          "estimateValue": 1250000
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

